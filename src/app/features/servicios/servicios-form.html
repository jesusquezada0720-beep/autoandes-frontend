<section class="page-heading"><div><span class="eyebrow">CATÁLOGO / SERVICIOS</span><h1>{{id?'Editar servicio':'Nuevo servicio'}}</h1><p>Completa los datos del catálogo del taller.</p></div></section>
<section class="panel form-panel">@if(loading()){<div class="state">Cargando…</div>}@else{<form [formGroup]="form" (ngSubmit)="guardar()" novalidate><div class="form-grid"><label>Código<input formControlName="codigo" placeholder="SRV-009" maxlength="7"><small class="field-error">{{form.controls.codigo.touched?mensaje('codigo'):''}}</small></label><label>Nombre del servicio<input formControlName="nombre" placeholder="Cambio de aceite"><small class="field-error">{{form.controls.nombre.touched?mensaje('nombre'):''}}</small></label><label>Precio (S/)<input type="number" step="0.01" formControlName="precio"><small class="field-error">{{form.controls.precio.touched?mensaje('precio'):''}}</small></label><label>Duración (minutos)<input type="number" formControlName="duracionMin"><small class="field-error">{{form.controls.duracionMin.touched?mensaje('duracionMin'):''}}</small></label></div>@if(error()){<div class="alert error">{{error()}}</div>}<div class="form-actions"><a class="button secondary" routerLink="/servicios">Cancelar</a><button class="button primary" [disabled]="saving()">{{saving()?'Guardando…':'Guardar servicio'}}</button></div></form>}</section>
