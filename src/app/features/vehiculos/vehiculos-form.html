<section class="page-heading"><div><span class="eyebrow">FLOTA / VEHÍCULOS</span><h1>{{id?'Editar vehículo':'Nuevo vehículo'}}</h1><p>Asocia el vehículo con uno de los clientes registrados.</p></div></section><section class="panel form-panel">@if(loading()){<div class="state">Cargando…</div>}@else{<form [formGroup]="form" (ngSubmit)="guardar()" novalidate><div class="form-grid"><label>Placa<input formControlName="placa" placeholder="ABC-123" maxlength="7"><small class="field-error">{{form.controls.placa.touched?mensaje('placa'):''}}</small></label><label>Marca<input formControlName="marca" placeholder="Toyota"><small class="field-error">{{form.controls.marca.touched?mensaje('marca'):''}}</small></label><label>Modelo<input formControlName="modelo" placeholder="Corolla"><small class="field-error">{{form.controls.modelo.touched?mensaje('modelo'):''}}</small></label><label>Año<input type="number" formControlName="anio"><small class="field-error">{{form.controls.anio.touched?mensaje('anio'):''}}</small></label><label>Cliente<select formControlName="clienteId"><option [ngValue]="0" disabled>Selecciona un cliente</option>@for(c of clientes();track c.id){<option [ngValue]="c.id">{{c.nombres}} · {{c.documento}}</option>}</select><small class="field-error">{{form.controls.clienteId.touched?mensaje('clienteId'):''}}</small></label></div>@if(error()){<div class="alert error">{{error()}}</div>}<div class="form-actions"><a class="button secondary" routerLink="/vehiculos">Cancelar</a><button class="button primary" [disabled]="saving()">{{saving()?'Guardando…':'Guardar vehículo'}}</button></div></form>}</section>
